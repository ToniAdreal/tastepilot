[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tastepilot"
version = "0.1.0"
description = "TastePilot — a taste-aware planning agent. Every recommendation traces to a Qloo API response, sealed in a hash-chained evidence log and verified by a deterministic checker."
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
tastepilot = "tastepilot.cli:main"

[tool.setuptools]
packages = ["tastepilot"]
package-data = { tastepilot = ["static/*.html"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
